<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超市跑酷 - 穩定修正版</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #333; font-family: sans-serif; }
        #game-container { position: relative; width: 100vw; height: 100vh; max-width: 600px; margin: 0 auto; background: #fff; }
        canvas { display: block; width: 100%; height: 100%; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .stats { padding: 20px; display: flex; justify-content: space-between; color: #fff; font-size: 20px; text-shadow: 2px 2px 4px #000; }
        .target-card {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px; border-radius: 15px;
            border: 4px solid #2ecc71; text-align: center; pointer-events: auto; min-width: 120px;
        }
        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(46, 204, 113, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; pointer-events: auto; z-index: 100;
        }
        .btn { background: white; color: #2ecc71; border: none; padding: 15px 50px; font-size: 22px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="stats"><div id="score-txt">分數: 0</div></div>
        <div id="target-ui" class="target-card hidden" onclick="game.speak()">
            <div id="word-txt" style="font-size:28px; font-weight:bold;">載入中...</div>
            <small>🔊 點擊發音 & 暫停</small>
        </div>
        <div id="menu" class="modal">
            <h1>超市跑酷</h1>
            <button class="btn" onclick="game.start()">點擊開始遊戲</button>
        </div>
    </div>
</div>

<script>
const DATA = [
    { n: "牛奶", s: "blue" }, { n: "雞腿", s: "orange" }, { n: "衛生紙", s: "gray" },
    { n: "麵包", s: "brown" }, { n: "雞蛋", s: "white" }, { n: "蘋果", s: "red" },
    { n: "打折", s: "yellow" }, { n: "收銀台", s: "purple" }, { n: "推車", s: "black" }
];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w, h;

const game = {
    running: false, paused: false, lane: 1, items: [], target: null, score: 0, offset: 0, speed: 4,

    start() {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('target-ui').classList.remove('hidden');
        this.score = 0; this.speed = 4; this.items = []; this.running = true;
        this.next();
        this.loop();
    },

    next() {
        this.target = DATA[Math.floor(Math.random() * DATA.length)];
        document.getElementById('word-txt').innerText = this.target.n;
    },

    speak() {
        this.paused = true;
        const m = new SpeechSynthesisUtterance(this.target.n);
        m.lang = 'zh-TW';
        m.onend = () => { game.paused = false; };
        window.speechSynthesis.speak(m);
    },

    update() {
        if(!this.running || this.paused) return;
        this.offset = (this.offset + this.speed) % 100;
        if(this.items.length === 0 || this.items[this.items.length-1].y > 300) {
            const ok = Math.floor(Math.random()*3);
            for(let i=0; i<3; i++) {
                this.items.push({
                    x: i, y: -100, 
                    data: i===ok ? this.target : DATA[Math.floor(Math.random()*DATA.length)],
                    isOk: i===ok
                });
            }
        }
        this.items.forEach((it, i) => {
            it.y += this.speed;
            if(it.y > h-150 && it.y < h-80 && it.x === this.lane) {
                if(it.isOk) { this.score+=10; this.next(); this.items=[]; }
                else { this.running = false; alert("撞錯了！分數: " + this.score); location.reload(); }
            }
        });
        this.items = this.items.filter(it => it.y < h + 100);
        document.getElementById('score-txt').innerText = "分數: " + this.score;
    },

    draw() {
        ctx.fillStyle = "#bdc3c7"; ctx.fillRect(0,0,w,h);
        ctx.strokeStyle = "#fff";
        for(let i=-1; i<12; i++) {
            ctx.beginPath(); ctx.moveTo(0, i*100+this.offset); ctx.lineTo(w, i*100+this.offset); ctx.stroke();
        }
        const px = w*0.23 + this.lane*(w*0.27);
        ctx.fillStyle = "#2c3e50"; ctx.fillRect(px-30, h-140, 60, 80);
        this.items.forEach(it => {
            const ix = w*0.23 + it.x*(w*0.27);
            ctx.fillStyle = "white"; ctx.fillRect(ix-40, it.y-40, 80, 80);
            ctx.fillStyle = "#333"; ctx.textAlign="center"; ctx.fillText(it.data.n, ix, it.y);
            ctx.fillStyle = it.data.s; ctx.beginPath(); ctx.arc(ix, it.y-25, 8, 0, 7); ctx.fill();
        });
    },

    loop() {
        if(!this.running) return;
        this.update();
        this.draw();
        requestAnimationFrame(() => this.loop());
    }
};

function resize() { w=canvas.width=canvas.offsetWidth; h=canvas.height=canvas.offsetHeight; }
window.addEventListener('resize', resize);
resize();

canvas.addEventListener('mousedown', (e) => {
    if(e.clientX < window.innerWidth/2) { if(game.lane>0) game.lane--; }
    else { if(game.lane<2) game.lane++; }
});
</script>
</body>
</html>
